name: E2E

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  e2e:
    name: E2E tests on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          name: e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build the manager image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/slashnephy/authentik-operator:e2e
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max

      - name: Run the e2e tests
        env:
          SKIP_IMAGE_BUILD: "1"
        run: make test-e2e

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n authentik-operator logs deployment/authentik-operator-controller-manager --tail=500 || true
          kubectl get authentikapplications -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
