name: E2E

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  e2e:
    name: E2E tests on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run the e2e tests
        run: make test-e2e

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n authentik-operator logs deployment/authentik-operator-controller-manager --tail=500 || true
          kubectl get authentikapplications -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
