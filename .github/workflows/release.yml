name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Check that the tag matches the supported authentik minor version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          hack/release/check-version.sh "${TAG}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  image:
    name: Publish the container image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/slashnephy/authentik-operator
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            # This workflow only runs on a published release, and the tag scheme has no prerelease form,
            # so every build this produces is the latest one. {{is_default_branch}} is always false on a tag ref.
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  chart:
    name: Publish the Helm chart
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Package the chart
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          hack/release/set-chart-version.sh "${VERSION}"
          helm package charts/chart --destination dist/chart

      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/chart/*.tgz --clobber

      - name: Clone the gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update the Helm repository index
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.check.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        # The generated index.yaml starts with `apiVersion:`, so Jekyll copies it verbatim.
        # Keep it that way: a leading `---` would be read as front matter and stripped from the served file.
        run: |
          helm repo index dist/chart \
            --url "https://github.com/${REPOSITORY}/releases/download/${TAG}" \
            --merge gh-pages/index.yaml
          cp dist/chart/index.yaml gh-pages/index.yaml
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git commit -m "chore: publish the authentik-operator chart ${VERSION}"
          git push origin HEAD:gh-pages
